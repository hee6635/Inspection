<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="app.css">
<script>
  // safety net: show script errors instead of a blank screen
  window.onerror = (m, s, l) => { const t = document.getElementById('toast'); if (t) { t.textContent = '오류: ' + m + ' (' + l + ')'; t.classList.add('on'); } };
</script>
</head>
<body>
<header><h1>설비점검</h1><button id="more" aria-label="메뉴">⋯</button></header>
<nav id="tabs"></nav>
<main id="list"></main>
<div id="toast"></div>
<div id="dim"></div>
<div id="pop"></div>
<script src="js/tree.js"></script>
<script src="js/app.js"></script>
</body>
</html>
