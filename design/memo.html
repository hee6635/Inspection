<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../app/src/main/assets/app.css"><style>
body{display:flex;gap:24px;padding:20px;background:#e9ecef;font-family:"Noto Sans CJK KR",sans-serif}
.ph{width:340px;height:640px;background:var(--bg);border:9px solid #191f28;border-radius:32px;overflow:hidden;position:relative}
.c{font-weight:700;font-size:15px;margin-bottom:8px;text-align:center}
.mode{flex:1;display:flex;gap:14px;align-items:baseline}
.mode b{font-size:24px;color:var(--tx)}.mode span{font-size:18px;font-weight:700;color:var(--mute)}
#tabs .tab:first-child{background:var(--card);color:var(--tx);outline:1.5px solid var(--blue)}
.note{margin:4px 16px 4px 64px;padding:10px 12px;border-radius:12px;background:var(--fill);color:var(--tx);font-size:15px;display:flex;gap:8px;align-items:center}
.note:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--mute);flex:none}
.mico{background:#eef4ff!important}.mico svg{stroke:var(--blue)!important}
</style></head><body>

<div class="card"><div class="row"><div class="ico"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L4 16.8V20h3.2l5.3-5.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.3-.6-.6-2.3z"/></svg></div><div class="nm">Grinder 유압</div><div class="chev">⌄</div></div></div></main>
